<html>

        <title>Transiton</title>

    <body>
        <h1>Transition </h1>
        <div>
        </div>
    <style>
        div{
            background-color:greenyellow;
            width:200px;
            height:100%;
            overflow:scroll;
            transition: width 2s;
            transition-delay: 3s;
            transition-timing-function:ease;
            animation: kavya infinite;
            position:static;
    


        }
        div:hover{
            width:300px;
            }
        

    </style>
    </body>
</html>
